# Which JVM Gradle itself runs on, so a clone builds without anyone setting JAVA_HOME.
#
# Android Studio now bundles a JDK 25 JBR, which Gradle 8.11.1 refuses to start on - from the
# command line that surfaces as a bare "25.0.3" build failure with no explanation. Naming the
# version here lets Gradle pick a JDK that works and ignore whatever JAVA_HOME happens to be,
# without putting one machine's path in a committed file.
toolchainVersion=21
